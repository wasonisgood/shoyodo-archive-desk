<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>蕉葉堂 逸品新著通知</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Shippori Mincho", "Yu Mincho", "Hiragino Mincho ProN", "MS Mincho", "Songti TC", serif;
    }

    /* 浮動和風宣紙卡片 */
    .toast-container {
      position: absolute;
      inset: 10px;
      background: #f7f3ea;
      background-image: 
        radial-gradient(#e5d8c3 0.75px, transparent 0.75px),
        radial-gradient(#eedfce 0.75px, #f7f3ea 0.75px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      border: 2px solid #ad3a2a;
      box-shadow: 
        0 18px 40px rgba(35, 32, 27, 0.45),
        0 0 0 1px #cbba9c inset,
        0 0 24px rgba(173, 58, 42, 0.18);
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: toastGlideIn 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .toast-container:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 
        0 24px 48px rgba(35, 32, 27, 0.55),
        0 0 0 1px #ad3a2a inset,
        0 0 30px rgba(173, 58, 42, 0.3);
    }

    .toast-container.dismissing {
      animation: toastGlideOut 0.5s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    /* 頂部泥金與朱紅雙色細天帶 */
    .toast-header {
      background: #23201b;
      color: #f7f3ea;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #ad3a2a;
    }

    .toast-kicker {
      font-size: 11px;
      letter-spacing: 0.22em;
      color: #dfcaa5;
      font-family: "Cormorant Garamond", "Times New Roman", serif;
      text-transform: uppercase;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toast-kicker::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #ad3a2a;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff5a43;
      animation: blinkRed 1.8s infinite alternate ease-in-out;
    }

    .toast-close-btn {
      background: transparent;
      border: none;
      color: #a89f91;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 2px;
      transition: color 0.15s, background 0.15s;
    }
    .toast-close-btn:hover {
      color: #fff;
      background: #ad3a2a;
    }

    /* 內容主體 */
    .toast-body {
      padding: 10px 16px;
      flex: 1;
      display: flex;
      gap: 14px;
      align-items: center;
      position: relative;
    }

    /* 封面或市場圖騰 */
    .toast-cover-box {
      width: 58px;
      height: 74px;
      background: #ede6d8;
      border: 1px solid #cbba9c;
      box-shadow: 2px 3px 8px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      border-radius: 2px;
    }

    .toast-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .toast-cover-placeholder {
      font-size: 26px;
      color: #ad3a2a;
      opacity: 0.85;
      font-family: "Shippori Mincho", serif;
      font-weight: 700;
    }

    /* 資訊區 */
    .toast-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .toast-tag-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast-site-badge {
      display: inline-block;
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #ad3a2a;
      background: rgba(173, 58, 42, 0.1);
      border: 1px solid rgba(173, 58, 42, 0.35);
      border-radius: 2px;
    }

    .toast-title {
      font-size: 14.5px;
      font-weight: 700;
      color: #23201b;
      line-height: 1.35;
      letter-spacing: 0.05em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast-meta-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-top: 2px;
    }

    .toast-price-tag {
      font-size: 16px;
      font-weight: 700;
      color: #ad3a2a;
      font-family: "Cormorant Garamond", Georgia, serif;
      letter-spacing: 0.04em;
    }

    .toast-action-hint {
      font-size: 11px;
      color: #7d7363;
      letter-spacing: 0.1em;
      text-decoration: underline;
    }

    /* 華麗落款朱印蓋印動畫 */
    .toast-seal-stamp {
      position: absolute;
      right: 18px;
      bottom: 8px;
      width: 48px;
      height: 48px;
      border: 2px solid #ad3a2a;
      color: #ad3a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.15em;
      border-radius: 4px;
      transform: rotate(-9deg) scale(0);
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 0 10px rgba(173, 58, 42, 0.3);
      animation: stampImpact 0.5s cubic-bezier(0.2, 0.8, 0.3, 1.2) 0.35s forwards;
    }

    .toast-seal-stamp::after {
      content: attr(data-text);
      writing-mode: vertical-rl;
    }

    /* 底部金色倒數進度細線 */
    .toast-progress-line {
      height: 3px;
      background: linear-gradient(90deg, #ad3a2a, #d4af37, #ad3a2a);
      width: 100%;
      transform-origin: left;
      animation: progressDrain 7s linear forwards;
    }

    @keyframes toastGlideIn {
      0% {
        transform: translateY(70px) scale(0.92);
        opacity: 0;
      }
      70% {
        transform: translateY(-6px) scale(1.02);
        opacity: 1;
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    @keyframes toastGlideOut {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(80px) scale(0.9);
        opacity: 0;
      }
    }

    @keyframes stampImpact {
      0% {
        transform: rotate(-25deg) scale(2.6);
        opacity: 0;
      }
      60% {
        transform: rotate(-9deg) scale(0.92);
        opacity: 0.95;
      }
      100% {
        transform: rotate(-9deg) scale(1);
        opacity: 0.88;
      }
    }

    @keyframes blinkRed {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    @keyframes progressDrain {
      0% { transform: scaleX(1); }
      100% { transform: scaleX(0); }
    }
  </style>
</head>
<body>
  <div class="toast-container" id="toastContainer">
    <!-- 頂部黑底泥金細天帶 -->
    <div class="toast-header">
      <div class="toast-kicker" id="kickerText">
        SHOYODO ARCHIVE DESK ・ 逸品新著收載
      </div>
      <button class="toast-close-btn" id="btnClose" title="關閉通知">✕</button>
    </div>

    <!-- 內容主體 -->
    <div class="toast-body">
      <div class="toast-cover-box" id="coverBox">
        <span class="toast-cover-placeholder" id="coverPlaceholder">古</span>
      </div>

      <div class="toast-info">
        <div class="toast-tag-row">
          <span class="toast-site-badge" id="siteBadge">日本の古本屋</span>
          <span style="font-size: 11px; color: #8d8373;" id="eraYear">戦前資料 ≦1945</span>
        </div>
        <div class="toast-title" id="itemTitle">《昭和拾一年 改訂 尋常小學算術》</div>
        <div class="toast-meta-row">
          <span class="toast-price-tag" id="itemPrice">¥ 550 円</span>
          <span class="toast-action-hint" id="actionHint">點擊開卷閱覽 ➔</span>
        </div>
      </div>

      <!-- 落款朱印 -->
      <div class="toast-seal-stamp" id="sealStamp" data-text="収載"></div>
    </div>

    <!-- 倒數時間條 -->
    <div class="toast-progress-line" id="progressLine"></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    // 解析傳入的參數
    const urlParams = new URLSearchParams(window.location.search);
    let payload = {};
    try {
      const raw = urlParams.get('data');
      if (raw) payload = JSON.parse(decodeURIComponent(raw));
    } catch (e) {}

    // 填充資料
    if (payload.kicker) document.getElementById('kickerText').textContent = payload.kicker;
    if (payload.title) document.getElementById('itemTitle').textContent = payload.title;
    if (payload.siteName) document.getElementById('siteBadge').textContent = payload.siteName;
    if (payload.eraYear) document.getElementById('eraYear').textContent = payload.eraYear;
    if (payload.actionHint) document.getElementById('actionHint').textContent = payload.actionHint;
    if (payload.sealText) document.getElementById('sealStamp').setAttribute('data-text', payload.sealText);
    if (payload.iconText) document.getElementById('coverPlaceholder').textContent = payload.iconText;

    if (payload.price !== undefined && payload.price !== null && payload.price !== '') {
      document.getElementById('itemPrice').textContent = '¥ ' + Number(payload.price).toLocaleString() + ' 円';
    } else if (payload.body) {
      const priceEl = document.getElementById('itemPrice');
      priceEl.textContent = payload.body;
      priceEl.style.fontSize = '12px';
      priceEl.style.fontWeight = '500';
      priceEl.style.color = '#5d554a';
    } else {
      document.getElementById('itemPrice').textContent = '';
    }

    if (payload.coverImage) {
      const box = document.getElementById('coverBox');
      box.innerHTML = `<img src="${payload.coverImage}" class="toast-cover-img" alt="cover" onerror="this.outerHTML='<span class=\\'toast-cover-placeholder\\'>古</span>'" />`;
    }

    // 自製專屬日本古典和風雅樂・十三絃箏與磬鐘妙音 (Web Audio API 純原創合成)
    function playJapaneseClassicalKotoMelody() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        const masterGain = ctx.createGain();
        masterGain.gain.setValueAtTime(0.75, now);
        masterGain.connect(ctx.destination);

        // 模擬桐木琴身（Paulownia wood body）與真絲琴絃（Silk string）之十三絃箏撥奏
        function playKotoPluck(freq, startTime, duration = 1.3, volume = 0.28) {
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const pluckGain = ctx.createGain();
          const filter = ctx.createBiquadFilter();

          // 低通濾波器模擬箏柱與木質琴胎之吸音與箱體共振
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(freq * 3.8, startTime);
          filter.frequency.exponentialRampToValueAtTime(freq * 1.1, startTime + duration);

          // 琴絃基音 (三角波) + 微音高飄逸 (泛音 sine)
          osc1.type = 'triangle';
          osc1.frequency.setValueAtTime(freq, startTime);

          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(freq * 2.005, startTime);

          // 極速撥絃衝擊 (8ms Attack) -> 悠長溫潤指數衰減 (Exponential Decay)
          pluckGain.gain.setValueAtTime(0.0001, startTime);
          pluckGain.gain.linearRampToValueAtTime(volume, startTime + 0.008);
          pluckGain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

          osc1.connect(filter);
          osc2.connect(filter);
          filter.connect(pluckGain);
          pluckGain.connect(masterGain);

          osc1.start(startTime);
          osc2.start(startTime);
          osc1.stop(startTime + duration);
          osc2.stop(startTime + duration);
        }

        // 禪寺梵鐘磬音（Singing Bowl & Temple Bell）清雅回響
        function playTempleBell(freq, startTime, duration = 2.8, volume = 0.12) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          osc.frequency.exponentialRampToValueAtTime(freq * 0.996, startTime + duration);

          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.linearRampToValueAtTime(volume, startTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

          osc.connect(gain);
          gain.connect(masterGain);

          osc.start(startTime);
          osc.stop(startTime + duration);
        }

        // 日本傳統經典「都節音階（Miyako-bushi Scale）」五聲音階原創旋律：
        // 箏引子與磬鐘齊鳴
        playTempleBell(880, now + 0.0, 2.6, 0.14);
        playTempleBell(1760, now + 0.0, 1.8, 0.06);

        // 箏曲旋律逐音流淌 (D4 -> A4 -> Bb4 -> G4 -> D5)
        playKotoPluck(293.66, now + 0.06, 1.4, 0.32); // 壹：D4（沈穩開卷）
        playKotoPluck(440.00, now + 0.32, 1.2, 0.26); // 貳：A4（五度清越）
        playKotoPluck(466.16, now + 0.58, 1.3, 0.28); // 參：Bb4（和風微升哀艷之美）
        playKotoPluck(392.00, now + 0.86, 1.2, 0.24); // 肆：G4（空靈迴轉）
        playKotoPluck(587.33, now + 1.15, 1.9, 0.34); // 伍：D5（高八度清透如初雪落地）

        // 餘韻鈴聲
        playTempleBell(1760, now + 1.20, 2.4, 0.10);
      } catch (e) {
        console.warn('和風音樂合成失敗:', e);
      }
    }

    playJapaneseClassicalKotoMelody();

    // 關閉邏輯
    let isDismissing = false;
    function dismissToast() {
      if (isDismissing) return;
      isDismissing = true;
      const el = document.getElementById('toastContainer');
      el.classList.add('dismissing');
      setTimeout(() => {
        ipcRenderer.send('toast-close');
      }, 450);
    }

    // 點擊卡片開啟主視窗
    document.getElementById('toastContainer').addEventListener('click', (e) => {
      if (e.target.id === 'btnClose') return;
      ipcRenderer.send('toast-clicked', payload);
      dismissToast();
    });

    document.getElementById('btnClose').addEventListener('click', (e) => {
      e.stopPropagation();
      dismissToast();
    });

    // 7 秒後自動飄逸退場（若滑鼠懸停在上面則暫停計時）
    let dismissTimer = setTimeout(dismissToast, 7000);
    const container = document.getElementById('toastContainer');
    const pLine = document.getElementById('progressLine');

    container.addEventListener('mouseenter', () => {
      clearTimeout(dismissTimer);
      pLine.style.animationPlayState = 'paused';
    });

    container.addEventListener('mouseleave', () => {
      pLine.style.animationPlayState = 'running';
      dismissTimer = setTimeout(dismissToast, 3000);
    });
  </script>
</body>
</html>
